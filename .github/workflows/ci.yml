name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Validate Python package imports
        env:
          APIFY_API_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          DATA_DIR: ./data
        run: |
          python -m compileall app/
          python -c "from app.main import app; print(app.title)"

  admin-dashboard:
    name: Admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/admin-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node dependencies
        run: npm install

      - name: Build admin dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://0.0.0.0:8000
        run: npm run build

  deploy:
    name: Deploy to Dev Server
    needs: [backend, admin-dashboard]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin ${{ github.ref_name }}
            
            # Restart backend
            # Assuming a process manager like pm2 or systemd is used
            # I'm using pm2:
            cd backend && pm2 restart all || pm2 start "python -m uvicorn app.main:app" --name social-backend
            
            # Restart/Build frontend
            #cd backend/admin-dashboard && npm install && npm run build && pm2 restart social-frontend || pm2 start "npm run start" --name social-frontend
            
            echo "Deployment successful."
