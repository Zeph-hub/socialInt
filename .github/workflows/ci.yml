name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python package imports
        env:
          APIFY_API_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          DATA_DIR: ./data
        run: |
          python -m compileall app/api app/core app/models app/services
          python -m py_compile app/main.py
          python -c "from app.main import app; print(app.title)"

  admin-dashboard:
    name: Admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/admin-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Build admin dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
